name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  publish-gate:
    name: Publication gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m755 gitleaks /usr/local/bin/gitleaks

      # Defense in depth. The primary control is the identical script run by
      # the pre-push hook, because CI runs after content has already reached
      # GitHub and disclosure is irreversible.
      - name: Denylist and secret scan
        run: ./scripts/check-publish.sh

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The contract tests that check this file against the running API live in
      # the private repository: they boot the API against a real database. What
      # is enforceable here is that the document is well-formed, which is not
      # nothing. Two real bugs in this file were an unquoted comma inside a YAML
      # flow mapping silently becoming a second key, exactly what this catches.
      - name: Specification is valid OpenAPI 3.1
        run: npx --yes @redocly/cli@1.34.2 lint openapi/42min.v1.yaml

  webhook-example:
    name: Webhook example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies by design, so there is nothing to install. If the
      # signature verification we publish ever stops being correct, this fails.
      - name: Signature verification tests
        run: node --test
        working-directory: examples/webhook-receiver

  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Validate against Cursor's OWN published schemas, not our idea of them.
      # An earlier version of this job checked JSON syntax and path resolution
      # only, and happily passed manifests the marketplace rejects: a string
      # `owner` where an object is required, plugin entries as bare strings, a
      # top-level `description` the schema forbids. Syntax checks give
      # confidence without giving correctness.
      # Every JSON file, not just the two the schemas cover. An earlier version
      # of this job dropped this loop, which meant a malformed mcp.json would
      # pass: nothing parsed it.
      - name: All JSON files parse
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "invalid JSON: $f"; fail=1; }
          done < <(git ls-files '*.json')
          exit $fail

      - name: Validate manifests against Cursor's schemas
        run: |
          npm install --no-save ajv@8.17.1 ajv-formats@3.0.1
          curl -sSfL https://raw.githubusercontent.com/cursor/plugins/main/schemas/marketplace.schema.json -o /tmp/marketplace.schema.json
          curl -sSfL https://raw.githubusercontent.com/cursor/plugins/main/schemas/plugin.schema.json -o /tmp/plugin.schema.json
          node -e '
            const Ajv = require("ajv"), addFormats = require("ajv-formats"), fs = require("fs");
            const ajv = new Ajv({allErrors: true, strict: false});
            addFormats(ajv);
            let failed = false;
            const pairs = [
              ["/tmp/marketplace.schema.json", ".cursor-plugin/marketplace.json"],
              ["/tmp/plugin.schema.json", "plugins/42min/.cursor-plugin/plugin.json"],
            ];
            for (const [schema, doc] of pairs) {
              const validate = ajv.compile(JSON.parse(fs.readFileSync(schema, "utf8")));
              if (validate(JSON.parse(fs.readFileSync(doc, "utf8")))) {
                console.log(`ok    ${doc}`);
              } else {
                failed = true;
                console.error(`FAIL  ${doc}`);
                for (const e of validate.errors) console.error(`        ${e.instancePath || "(root)"} ${e.message}`);
              }
            }
            process.exit(failed ? 1 : 0);
          '

      # Cursor rejects absolute paths and any ".." segment, and a manifest that
      # points at a file which is not there installs as a broken plugin.
      - name: Manifest paths are relative and resolvable
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          fail = []
          for manifest in pathlib.Path('plugins').glob('*/.cursor-plugin/plugin.json'):
              root = manifest.parent.parent
              data = json.loads(manifest.read_text())
              refs = [data.get('logo'), data.get('mcpServers')] + list(data.get('rules') or [])
              for ref in [r for r in refs if isinstance(r, str)]:
                  if ref.startswith('/') or '..' in ref.split('/'):
                      fail.append(f'{manifest}: path must be relative without "..": {ref}')
                  elif not (root / ref).exists():
                      fail.append(f'{manifest}: referenced file missing: {ref}')
          for line in fail:
              print(line)
          sys.exit(1 if fail else 0)
          PY

      # Every plugin listed by the marketplace must actually be there.
      - name: Marketplace entries resolve
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          mk = json.loads(pathlib.Path('.cursor-plugin/marketplace.json').read_text())
          fail = []
          for entry in mk.get('plugins', []):
              src = pathlib.Path(entry['source'])
              if not (src / '.cursor-plugin' / 'plugin.json').exists():
                  fail.append(f"marketplace entry {entry['name']}: no plugin.json under {src}")
                  continue
              declared = json.loads((src / '.cursor-plugin' / 'plugin.json').read_text()).get('name')
              if declared != entry['name']:
                  fail.append(f"marketplace says {entry['name']!r}, plugin.json says {declared!r}")
          for line in fail:
              print(line)
          sys.exit(1 if fail else 0)
          PY
