openapi: 3.1.0

info:
  title: 42min API
  version: "1.0.0"
  summary: Scheduling, availability and bookings for the 42min platform.
  description: |
    The 42min public REST API.

    **Envelope.** Every successful response is wrapped: the payload is under `data`,
    and `meta` always carries a `request_id`. Quote that id when reporting a problem.
    Errors are not wrapped in `data`; they return a top-level `error` object.

    **Forward compatibility.** New fields, endpoints and optional parameters ship
    without notice. Ignore unknown fields rather than rejecting them. A client that
    validates strictly against a fixed field list will break on a routine release.

    **No sandbox.** Write operations act on production. Creating a booking sends real
    email and writes to a real calendar. Test against event types you own.
  contact:
    name: 42min developers
    url: https://github.com/42min-us/42min-developers
    email: plus@42min.us
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.42min.us
    description: Production

security:
  - oauth2: []
  - personalAccessToken: []

tags:
  - name: Meta
    description: Connectivity and identity.
  - name: Event types
    description: Bookable meeting templates.
  - name: Slots
    description: Availability computation.
  - name: Bookings
    description: Creating and modifying bookings.
  - name: Series
    description: Recurring meetings booked as one repeating pattern.
  - name: Webhooks
    description: Subscriptions and delivery history.

paths:
  /v1/_ping:
    get:
      tags: [Meta]
      operationId: ping
      summary: Verify credentials and connectivity
      description: Cheapest authenticated call. Use it to confirm a token works.
      responses:
        "200":
          description: Reachable and authenticated.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me:
    get:
      tags: [Meta]
      operationId: getMe
      summary: The authenticated user and their organization
      security:
        - oauth2: [user:read]
        - personalAccessToken: [user:read]
      responses:
        "200":
          description: The connected identity.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Me" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/event-types:
    get:
      tags: [Event types]
      operationId: listEventTypes
      summary: List event types
      security:
        - oauth2: [event_types:read]
        - personalAccessToken: [event_types:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: sort
          in: query
          schema: { type: string, default: created_at_desc }
        - name: user_id
          in: query
          description: Only event types hosted by this user.
          schema: { type: string, format: uuid }
        - name: slug
          in: query
          schema: { type: string }
        - name: active
          in: query
          description: Filter by whether the event type accepts bookings.
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: A page of event types.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EventType" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/event-types/{idOrSlug}:
    get:
      tags: [Event types]
      operationId: getEventType
      summary: Get one event type
      description: |
        Identify the event type by its UUID, or by `username/event_slug`.

        The second form is a SINGLE path segment, so the slash must be
        percent-encoded: `/v1/event-types/ada%2Fintro-call`. Sent literally it is
        two path segments, matches no route, and answers 404.

        A bare slug on its own is rejected with 400 `invalid_query_param`. A slug
        is unique per user rather than per account, so without the username it
        does not identify one event type.
      security:
        - oauth2: [event_types:read]
        - personalAccessToken: [event_types:read]
      parameters:
        - name: idOrSlug
          in: path
          required: true
          description: |
            Either the event type UUID, or `username/event_slug` with the slash
            percent-encoded as `%2F`.
          schema: { type: string }
          examples:
            uuid:
              value: "6f2a1c94-0d3b-4f7e-8a25-1c9d4b7e0f31"
            usernameAndSlug:
              value: "ada%2Fintro-call"
      responses:
        "200":
          description: Full event type detail.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/EventTypeDetail" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/slots:
    get:
      tags: [Slots]
      operationId: listSlots
      summary: Bookable slots for an event type over a date range
      description: |
        Availability is computed from the host's schedule minus connected-calendar busy
        time, buffers, minimum notice and booking limits. Identify the event type by
        `event_type_id`, or by `username` plus `event_slug`.

        A very wide range is capped; when that happens `truncated` is `true` and you
        should narrow the range rather than paginate.
      security:
        - oauth2: [slots:read]
        - personalAccessToken: [slots:read]
      parameters:
        - name: event_type_id
          in: query
          schema: { type: string, format: uuid }
        - name: username
          in: query
          schema: { type: string }
        - name: event_slug
          in: query
          schema: { type: string }
        - name: start
          in: query
          required: true
          description: Start of the range, ISO 8601.
          schema: { type: string, format: date-time }
        - name: end
          in: query
          required: true
          description: End of the range, ISO 8601.
          schema: { type: string, format: date-time }
        - name: timezone
          in: query
          description: IANA timezone the slots are computed for.
          schema: { type: string, examples: ["Europe/Lisbon"] }
      responses:
        "200":
          description: Computed availability.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SlotList" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/slots/check:
    get:
      tags: [Slots]
      operationId: checkSlot
      summary: Check whether one specific start time is bookable
      description: |
        Call this before creating a booking. When unavailable, the response says why,
        and for `slot_busy` it suggests the next available start.
      security:
        - oauth2: [slots:read]
        - personalAccessToken: [slots:read]
      parameters:
        - name: event_type_id
          in: query
          schema: { type: string, format: uuid }
        - name: username
          in: query
          schema: { type: string }
        - name: event_slug
          in: query
          schema: { type: string }
        - name: start
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: end
          in: query
          description: Defaults to start plus the event type's duration.
          schema: { type: string, format: date-time }
        - name: timezone
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Whether the slot can be booked.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SlotCheck" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/bookings:
    get:
      tags: [Bookings]
      operationId: listBookings
      summary: List bookings
      security:
        - oauth2: [bookings:read]
        - personalAccessToken: [bookings:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: sort
          in: query
          schema: { type: string, default: start_at_desc }
        - name: status
          in: query
          description: Comma-separated list of statuses.
          schema: { type: string }
        - name: event_type_id
          in: query
          schema: { type: string, format: uuid }
        - name: series_id
          in: query
          schema: { type: string, format: uuid }
          description: Only bookings of this recurring series.
        - name: host_user_id
          in: query
          schema: { type: string, format: uuid }
        - name: host_user_ids
          in: query
          description: Supersedes host_user_id when both are given.
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: attendee_email
          in: query
          schema: { type: string, format: email }
        - name: start_date
          in: query
          schema: { type: string, format: date-time }
        - name: end_date
          in: query
          schema: { type: string, format: date-time }
        - name: updated_since
          in: query
          description: Only bookings modified at or after this instant. Use for incremental sync.
          schema: { type: string, format: date-time }
        - name: include_cancelled
          in: query
          description: Pass "false" to omit canceled bookings.
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: A page of bookings.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Booking" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Create a booking
      description: |
        Books a time on an active event type. Verify the slot with `/v1/slots/check`
        first: a slot that was free a moment ago may not be.

        **This sends real email and writes to a real calendar.** Retry with the same
        `Idempotency-Key` rather than reissuing the call, or you will create a second
        booking.
      security:
        - oauth2: [bookings:create]
        - personalAccessToken: [bookings:create]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingRequest" }
      responses:
        "201":
          description: Booking created.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Booking" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/SlotLockTimeout" }

  /v1/bookings/{uid}:
    parameters:
      - $ref: "#/components/parameters/BookingUid"
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Get one booking
      description: |
        Returns an `ETag`. Send it back as `If-Match` on a `PATCH` to make a concurrent
        edit fail loudly instead of silently overwriting.
      security:
        - oauth2: [bookings:read]
        - personalAccessToken: [bookings:read]
      responses:
        "200":
          description: The booking, including invitee form answers.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag:
              description: Opaque version token for optimistic locking.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Booking" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

    patch:
      tags: [Bookings]
      operationId: updateBooking
      summary: Update a booking
      description: |
        The only operation that supports optimistic locking. Send `If-Match` with the
        ETag from a prior read; a mismatch returns 409 rather than overwriting.
      security:
        - oauth2: [bookings:update]
        - personalAccessToken: [bookings:update]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: true
          description: |
            **Required.** The ETag from a prior `GET` of this booking. Omitting it
            returns 428 `missing_if_match` and the booking is not modified: read first,
            then send back the ETag you received.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBookingRequest" }
      responses:
        "200":
          description: Updated booking.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag:
              description: The new version token.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Booking" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Version conflict. The booking changed since the ETag you sent, or an
            immutable field was included in the body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/bookings/{uid}/cancel:
    post:
      tags: [Bookings]
      operationId: cancelBooking
      summary: Cancel a booking
      description: |
        Notifies the attendee and removes the calendar event. Idempotent: canceling an
        already-canceled booking returns its current state.

        For a group event this cancels one attendee's registration, not the session.
      security:
        - oauth2: [bookings:cancel]
        - personalAccessToken: [bookings:cancel]
      parameters:
        - $ref: "#/components/parameters/BookingUid"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1024
                  description: Shown to the attendee in the cancellation email.
      responses:
        "200":
          description: Canceled.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Booking" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/bookings/{uid}/reschedule:
    post:
      tags: [Bookings]
      operationId: rescheduleBooking
      summary: Move a booking to a new time
      description: |
        Notifies the attendee. Verify the new slot first; on `slot_unavailable`, call
        `/v1/slots` and offer real alternatives rather than retrying a guess.
      security:
        - oauth2: [bookings:reschedule]
        - personalAccessToken: [bookings:reschedule]
      parameters:
        - $ref: "#/components/parameters/BookingUid"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start]
              properties:
                start:
                  type: string
                  format: date-time
                  description: New start time, ISO 8601.
                timezone: { type: string }
                reason: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Rescheduled.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Booking" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/SlotLockTimeout" }

  /v1/series:
    get:
      tags: [Series]
      operationId: listSeries
      summary: List recurring series
      description: |
        Scoped to what the acting user may see: a member sees their own series, a
        manager the hosts in the groups they manage, an admin or owner the whole
        organization. A `host_user_id` outside that set returns an empty page rather
        than an error.
      security:
        - oauth2: [series:read]
        - personalAccessToken: [series:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: Comma-separated. Allowed values are `active`, `paused` and `ended`.
          schema: { type: string }
        - name: host_user_id
          in: query
          schema: { type: string, format: uuid }
        - name: event_type_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A page of series, newest first.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SeriesWithProgress" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

    post:
      tags: [Series]
      operationId: createSeries
      summary: Create a recurring series
      description: |
        Books up to `count` occurrences of one repeating pattern in a single call. The
        event type must have recurring enabled, otherwise the answer is 409
        `recurring_disabled`.

        Dates the host is not free on are SKIPPED, not shifted: the response lists what
        was created and what was skipped, so a series can come back with fewer
        occurrences than requested. When no date at all was free the answer is 409
        `no_dates_free` and nothing is created.

        **This sends real email and writes to a real calendar.** Retry with the same
        `Idempotency-Key` rather than reissuing the call.
      security:
        - oauth2: [series:write]
        - personalAccessToken: [series:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSeriesRequest" }
      responses:
        "201":
          description: Series created, with the occurrences it booked.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [series, occurrences, skipped]
                    properties:
                      series: { $ref: "#/components/schemas/Series" }
                      occurrences:
                        type: array
                        items: { $ref: "#/components/schemas/SeriesOccurrence" }
                      skipped:
                        type: array
                        items: { $ref: "#/components/schemas/SeriesSkip" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SeriesConflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AvailabilityUnavailable" }

  /v1/series/{uid}:
    parameters:
      - $ref: "#/components/parameters/SeriesUid"
    get:
      tags: [Series]
      operationId: getSeries
      summary: Get one series
      description: |
        The series plus `next_occurrence` and `remaining`, which say where it is in its
        run right now.

        Returns an `ETag` carrying the series' revision. Send it back as `If-Match` on
        `PATCH`, and optionally on `/resume`, so an action that another change overtook
        fails loudly instead of running against a series that moved.
      security:
        - oauth2: [series:read]
        - personalAccessToken: [series:read]
      responses:
        "200":
          description: The series.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag:
              description: The series revision, for optimistic locking.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/SeriesWithProgress" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

    patch:
      tags: [Series]
      operationId: updateSeries
      summary: Edit a series
      description: |
        Changing the pattern (`frequency`, `interval_weeks`, `weekdays`, `time`)
        rebuilds the upcoming occurrences: they become the new pattern's next dates,
        as many as the series has upcoming. An occurrence already on one of those
        dates is kept; the others are held and replaced on the missing dates. The
        round is reported under `resumed`, with zero counts when nothing had to
        move. A `location_url` or `notify_invitee` change restamps the existing
        occurrences and leaves the dates alone, so `resumed` is null. `resumed`
        describes the pattern edit, not the series' status: read `series.status`.

        `location_url` REPLACES an existing fixed link. A series that was not created
        with one cannot gain one here.

        A `version_conflict` or `series_busy` 409 from this route always means NOTHING
        was written: both are refusals that happen before the edit's first write. Once
        the pattern IS written, a replacement round that another action overtakes is
        reported in the 200 body under `resumed.superseded` rather than as an error:
        the series is then paused with `resumed.owed` occurrences waiting, and
        `/resume` with the current `ETag` finishes it.

        Two refusals can still arrive after the pattern was written, both from another
        action landing in the window between that write and the replacement round.
        `series_ended` means the series was ended in that window: the new pattern is
        saved, the series is over, and nothing further is owed. `event_type_not_found`
        means the event type itself was deleted in that window: deleting an event type
        cascades away every series and booking that references it, so the pattern just
        written, and the series it belonged to, are both gone.
      security:
        - oauth2: [series:write]
        - personalAccessToken: [series:write]
      parameters:
        - name: If-Match
          in: header
          required: true
          description: |
            **Required.** The ETag from a prior `GET` of this series. Omitting it
            returns 428 `missing_if_match` and nothing is modified.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSeriesRequest" }
      responses:
        "200":
          description: The edited series, plus the replacement round a pattern change triggered.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag:
              description: The new revision.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [series, resumed]
                    properties:
                      series: { $ref: "#/components/schemas/Series" }
                      resumed:
                        description: Null when no pattern field changed. Zero counts when the pattern changed but no occurrence had to move.
                        anyOf:
                          - $ref: "#/components/schemas/SeriesActionResult"
                          - type: "null"
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SeriesConflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/series/{uid}/pause:
    parameters:
      - $ref: "#/components/parameters/SeriesUid"
    post:
      tags: [Series]
      operationId: pauseSeries
      summary: Pause a series
      description: |
        Cancels every future occurrence and records each as OWED, so `/resume` books a
        replacement for it. Occurrences the invitee moved individually are left alone.
        Safe to repeat: a re-run holds whatever the first run did not reach.
      security:
        - oauth2: [series:write]
        - personalAccessToken: [series:write]
      responses:
        "200": { $ref: "#/components/responses/SeriesAction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SeriesConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/series/{uid}/resume:
    parameters:
      - $ref: "#/components/parameters/SeriesUid"
    post:
      tags: [Series]
      operationId: resumeSeries
      summary: Resume a paused series
      description: |
        Rebuilds the upcoming occurrences onto the pattern's next dates and
        reactivates the series: an occurrence already on one of those dates is
        kept, and the others are held and rebooked on the dates that are missing. A
        date the pattern generates but cannot use is reported under `skipped`,
        whether or not anything was booked. A meeting that could not be placed
        stays owed, so the series remains paused and a later call converges on the
        rest.

        `If-Match` is OPTIONAL here: send the ETag from a prior read to refuse a resume
        that another change overtook, or omit it to resume whatever the series is now.
      security:
        - oauth2: [series:write]
        - personalAccessToken: [series:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: false
          description: |
            Optional revision fence, from a prior `GET`. A value that does not parse
            as a valid version answers 400 `invalid_if_match`.
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/SeriesAction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SeriesConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AvailabilityUnavailable" }

  /v1/series/{uid}/end:
    parameters:
      - $ref: "#/components/parameters/SeriesUid"
    post:
      tags: [Series]
      operationId: endSeries
      summary: End a series
      description: |
        Cancels every future occurrence for good and sends the attendee one notice
        listing them. Nothing is owed afterwards and the series can never be resumed.
        Past occurrences are untouched.
      security:
        - oauth2: [series:write]
        - personalAccessToken: [series:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/SeriesAction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SeriesConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/series/{uid}/host:
    parameters:
      - $ref: "#/components/parameters/SeriesUid"
    post:
      tags: [Series]
      operationId: changeSeriesHost
      summary: Change the host of a series
      description: |
        Transfers every future occurrence to another user and then the series itself.
        A transfer that cannot complete (no writable calendar, another action taking
        the series over) stops the run: `moved` says how many occurrences did move and
        `stopped_by` names the reason. A `stopped_by` of null means the series host was
        changed; anything else means it was not, and the call can be repeated.
      security:
        - oauth2: [series:write]
        - personalAccessToken: [series:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeSeriesHostRequest" }
      responses:
        "200": { $ref: "#/components/responses/SeriesAction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SeriesConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List your webhook subscriptions
      description: |
        Scoped to the credential that created them: an OAuth client sees only its own
        subscriptions, and a personal access token only its own.
      security:
        - oauth2: [webhooks:read]
        - personalAccessToken: [webhooks:read]
      responses:
        "200":
          description: Your subscriptions.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Subscribe to events
      description: |
        The `signing_secret` is returned **only in this response**. Store it now; it
        cannot be read back, only rotated.

        Note this endpoint does not accept `Idempotency-Key`. A retried call creates a
        second subscription and both will deliver.
      security:
        - oauth2: [webhooks:write]
        - personalAccessToken: [webhooks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2000
                  description: HTTPS only.
                events:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/WebhookEventName" }
                description: { type: string, maxLength: 255 }
      responses:
        "201":
          description: Created. Contains the signing secret.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/WebhookWithSecret" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      tags: [Webhooks]
      operationId: getWebhook
      summary: Get one subscription
      security:
        - oauth2: [webhooks:read]
        - personalAccessToken: [webhooks:read]
      responses:
        "200":
          description: The subscription.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Webhook" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

    patch:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Update a subscription
      security:
        - oauth2: [webhooks:write]
        - personalAccessToken: [webhooks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri, maxLength: 2000 }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/WebhookEventName" }
                description: { type: string, maxLength: 255 }
                status: { type: string, enum: [active, paused] }
      responses:
        "200":
          description: Updated.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Webhook" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete a subscription
      description: |
        Safe against a duplicate request racing the first: concurrent deletes both
        succeed rather than one failing. This is narrower than full idempotency, and
        the distinction matters when you write retry logic. A *sequential* repeat, once
        the subscription is gone, returns 404 rather than 204. Treat that 404 as
        success if all you needed was for the subscription to be absent.
      security:
        - oauth2: [webhooks:write]
        - personalAccessToken: [webhooks:write]
      responses:
        "204":
          description: Deleted. No response body, so there is no envelope here.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such subscription, including one already deleted.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/webhooks/{id}/rotate-secret:
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate the signing secret
      description: |
        Returns a new secret and invalidates the old one immediately. Deliveries signed
        with the previous secret will fail verification from this point on.
      security:
        - oauth2: [webhooks:write]
        - personalAccessToken: [webhooks:write]
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      responses:
        "200":
          description: New signing secret.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/WebhookWithSecret" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/webhooks/{id}/test:
    post:
      tags: [Webhooks]
      operationId: testWebhook
      summary: Send a test delivery
      description: Sends a synthetic event to the subscription URL so you can verify signing.
      security:
        - oauth2: [webhooks:write]
        - personalAccessToken: [webhooks:write]
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      responses:
        "200":
          description: Test dispatched.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/WebhookDelivery" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/webhooks/{id}/deliveries:
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: Delivery history for a subscription
      description: Use this to debug a subscription that stopped working.
      security:
        - oauth2: [webhooks:read]
        - personalAccessToken: [webhooks:read]
      parameters:
        - $ref: "#/components/parameters/WebhookId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Recent delivery attempts, newest first.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

webhooks:
  booking.created:
