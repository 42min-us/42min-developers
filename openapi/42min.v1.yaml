        "2XX": { description: Acknowledged. }
  event_type.deleted:
    post:
      operationId: onEventTypeDeleted
      summary: An event type was deleted
      requestBody: { $ref: "#/components/requestBodies/EventTypeWebhook" }
      responses:
        "2XX": { description: Acknowledged. }
  routing.form_submitted:
    post:
      operationId: onRoutingFormSubmitted
      summary: A routing form was submitted
      requestBody: { $ref: "#/components/requestBodies/RoutingWebhook" }
      responses:
        "2XX": { description: Acknowledged. }

components:

  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        OAuth 2.1 authorization code with PKCE, for applications acting on behalf of a
        user. Dynamic Client Registration is supported, so a client can register itself
        without contacting us.

        Discovery: `https://api.42min.us/.well-known/oauth-authorization-server`
      flows:
        authorizationCode:
          authorizationUrl: https://api.42min.us/v1/oauth/authorize
          tokenUrl: https://api.42min.us/v1/oauth/token
          refreshUrl: https://api.42min.us/v1/oauth/token
          scopes:
            user:read: Read the connected user's own profile
            users:read: List organization members
            event_types:read: Read event types
            event_types:create: Create event types
            event_types:update: Modify event types
            event_types:delete: Delete event types
            event_types:write: Full write access to event types
            slots:read: Compute availability
            bookings:read: Read bookings
            bookings:create: Create bookings
            bookings:cancel: Cancel bookings
            bookings:reschedule: Reschedule bookings
            bookings:update: Modify booking metadata and form answers
            bookings:write: Full write access to bookings
            webhooks:read: Read webhook subscriptions
            webhooks:write: Manage webhook subscriptions
            availability:read: Read schedules and availability
            availability:write: Modify schedules and availability
            meetings:read: Read the host-side meetings view
            meetings:write: Modify meetings
            contacts:read: Read contacts
            single_use_links:read: Read single-use booking links
            single_use_links:write: Create and delete single-use booking links
            roundtables:read: Read meeting polls
            roundtables:write: Manage meeting polls
            routing_forms:read: Read routing forms and responses
            routing_forms:create: Create routing forms
            routing_forms:update: Modify routing forms
            series:read: View recurring meetings
            series:write: Create and manage recurring meetings
            offline_access: Receive a refresh token
    personalAccessToken:
      type: http
      scheme: bearer
      description: |
        A personal access token, for scripts acting as one person. Send it as
        `Authorization: Bearer <token>`. Tokens carry scopes exactly as OAuth tokens do.

  parameters:
    Limit:
      name: limit
      in: query
      description: Items per page. Values above the maximum are clamped, not rejected.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque cursor from a previous response's `meta.next_cursor`. Treat it as
        meaningless text: its encoding is not part of this contract.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        **Required.** Omitting it returns 400 `missing_idempotency_key`; the request is
        not performed. Generate a unique key per logical operation (a UUID is fine).

        Retrying with the same key replays the original result rather than acting twice.
        A different key means a different operation, so a retry with a fresh key creates
        a second booking.
      schema: { type: string, maxLength: 255 }
    BookingUid:
      name: uid
      in: path
      required: true
      schema: { type: string }
    SeriesUid:
      name: uid
      in: path
      required: true
      description: |
        Must be a UUID. A malformed value answers 404 `series_not_found`, exactly like
        an id that does not exist, so the route never confirms which is which.
      schema: { type: string, format: uuid }
    WebhookId:
      name: id
      in: path
      required: true
      description: |
        Must be a UUID. A malformed value is rejected with 400 `invalid_request`
        before any lookup, rather than treated as a resource that does not exist.
      schema: { type: string, format: uuid }

  headers:
    X-Request-Id:
      description: |
        Present on every response, and identical to `request_id` in the body. Log it:
        it is what lets us find your request when you report a problem.
      schema: { type: string }
    X-RateLimit-Limit:
      description: Requests permitted in the current window.
      schema: { type: integer }
    X-RateLimit-Remaining:
      description: Requests left in the current window.
      schema: { type: integer }
    X-RateLimit-Reset:
      description: Unix epoch seconds at which the window resets.
      schema: { type: integer }

  requestBodies:
    BookingWebhook:
      required: true
      description: |
        Sent to your endpoint with the headers described under
        `X-42min-Webhook-Signature` below. Respond with any 2xx to acknowledge;
        anything else is retried.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BookingWebhookEnvelope" }

    EventTypeWebhook:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EventTypeWebhookEnvelope" }

    RoutingWebhook:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RoutingWebhookEnvelope" }

  responses:
    BadRequest:
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      description: Malformed request or an invalid query parameter.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, malformed, expired or revoked credentials.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        WWW-Authenticate:
          description: |
            Bearer challenge, for example
            `Bearer realm="42min", error="invalid_token"`.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      description: |
        Authenticated but not permitted. Most often the token lacks a required scope,
        in which case the error code is `insufficient_scope`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      description: No such resource, or it belongs to another organization.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      description: |
        The request conflicts with current state. Branch on `error.code`:
        `slot_unavailable` (someone booked it first), `slot_in_past`,
        `booking_in_past`, `booking_already_cancelled`, `event_type_inactive`, or
        `version_conflict` (the `If-Match` ETag is stale).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      description: Well-formed but semantically rejected, such as writing an immutable field.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionRequired:
      description: |
        A required precondition header was missing. Currently only `If-Match` on
        `PATCH /v1/bookings/{uid}`, with error code `missing_if_match`.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    SlotLockTimeout:
      description: |
        Could not acquire the slot lock in time (`slot_lock_timeout`). Someone else is
        booking the same slot right now. This is transient: retry with the SAME
        `Idempotency-Key`, honoring `Retry-After`.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Retry-After:
          description: Seconds to wait. Currently always 1.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    RateLimited:
      description: Too many requests. Back off until the window resets.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    SeriesAction:
      description: |
        What the action did. Every count is what THIS call achieved, so a run that
        another change overtook (`superseded: true`) reports the part it finished and
        can simply be repeated.
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { $ref: "#/components/schemas/SeriesActionResult" }
              meta: { $ref: "#/components/schemas/Meta" }

    SeriesConflict:
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      description: |
        The request conflicts with the series' current state. Branch on `error.code`:
        `series_busy` (another action holds it, read again and retry),
        `series_superseded` (another action took it over mid-run),
        `series_ended` (terminal, nothing can change it),
        `recurring_disabled` (the event type does not allow recurring),
        `no_dates_free` (no date in the pattern was free, nothing was created),
        `slot_taken`, or `version_conflict` (the `If-Match` ETag is stale).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    AvailabilityUnavailable:
      description: |
        The host's conflict calendar could not be read (`availability_unavailable`), so
        whether the times are free is unknown and nothing was booked on a guess. This is
        transient: retry with the SAME `Idempotency-Key`, honoring `Retry-After`.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:

    Meta:
      type: object
      description: Present on every successful response.
      required: [request_id]
      properties:
        request_id:
          type: string
          description: Quote this when reporting a problem. It identifies the request in our logs.

    PageMeta:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          properties:
            next_cursor:
              type: [string, "null"]
              description: Pass as `cursor` for the next page. Null on the last page.
            has_more: { type: boolean }

    Error:
      type: object
      description: |
        Error responses are NOT wrapped in `data`. Branch on `code`, never on the
        human-readable `message`, which may change without notice.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable identifier. Generic values are `invalid_request`,
                `invalid_token`, `forbidden`, `not_found`, `conflict`, `rate_limited`
                and `service_unavailable`. Endpoints add specific codes such as
                `invalid_query_param`, `event_type_not_found`, `booking_not_found`,
                `slot_unavailable`, `field_immutable`, `missing_idempotency_key`,
                `missing_if_match` and `insufficient_scope`.
            message: { type: string }
            details:
              type: object
              description: Context for the error, such as the offending field. May be empty.
              additionalProperties: true
            request_id: { type: string }
      examples:
        - error:
            code: "slot_unavailable"
            message: "That time is no longer available"
            details: {}
            request_id: "req_01a0808c9fd8f69a474ad660eeca8b5e"

    Me:
      type: object
      required: [user, organization]
      properties:
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            username: { type: [string, "null"] }
            email: { type: string, format: email }
            name: { type: [string, "null"] }
            first_name: { type: [string, "null"] }
            last_name: { type: [string, "null"] }
            timezone: { type: [string, "null"] }
            locale: { type: [string, "null"] }
            avatar_url: { type: [string, "null"] }
        organization:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            plan: { type: [string, "null"] }

    EventType:
      type: object
      required:
        [id, slug, title, duration_minutes, active, scheduling_type, hosts, color,
         buffer_before_minutes, buffer_after_minutes, minimum_notice_hours,
         future_limit_days, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        duration_minutes: { type: integer }
        active: { type: boolean }
        scheduling_type:
          type: string
          enum: [individual, group, collective]
          description: |
            `collective` is this serializer's label for round robin, where one member of
            a team is assigned. It is not a separate event kind.
        hosts:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              username: { type: [string, "null"] }
              name: { type: [string, "null"] }
        url: { type: [string, "null"], description: Public booking page. }
        color: { type: string }
        buffer_before_minutes: { type: integer }
        buffer_after_minutes: { type: integer }
        minimum_notice_hours: { type: integer }
        future_limit_days: { type: integer }
        timezone: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventTypeDetail:
      allOf:
        - $ref: "#/components/schemas/EventType"
        - type: object
          properties:
            locations:
              type: array
              items:
                type: object
                properties:
                  type: { type: string }
                  label: { type: string }
                  value: { type: [string, "null"] }
            questions:
              type: array
              description: Invitee form questions, in display order.
              items:
                type: object
                properties:
                  id: { type: string }
                  key: { type: string }
                  label: { type: string }
                  type: { type: string }
                  required: { type: boolean }
            max_bookings_per_day: { type: [integer, "null"] }
            max_bookings_per_week: { type: [integer, "null"] }
            max_bookings_per_month: { type: [integer, "null"] }
            requires_confirmation: { type: boolean }
            allow_reschedule: { type: boolean }
            allow_cancel: { type: boolean }

    SlotList:
      type: object
      required: [event_type_id, timezone, computed_at, slots]
      properties:
        event_type_id: { type: string, format: uuid }
        timezone: { type: string }
        computed_at:
          type: string
          format: date-time
          description: |
            When availability was computed. Slots go stale quickly; treat a result older
            than a minute or two as advisory.
        slots:
          type: array
          items:
            type: object
            properties:
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              available: { type: boolean, const: true }
              host_user_id:
                type: string
                format: uuid
                description: Present for round robin, naming the member who would be assigned.
        truncated:
          type: boolean
          description: Present and true when the range produced more slots than are returned. Narrow the range.

    SlotCheck:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        duration_minutes:
          type: integer
          description: Present when available.
        reason:
          type: string
          description: Present when unavailable.
          enum: [event_type_inactive, in_past, outside_minimum_notice, outside_future_limit, slot_busy]
        next_available:
          type: [string, "null"]
          format: date-time
          description: Suggested alternative, present when the reason is `slot_busy`.

    Booking:
      type: object
      required:
        [uid, version, event_type_id, status, start_at, end_at, timezone, attendees,
         guests, calendar_sync_status, created_at, updated_at]
      properties:
        uid: { type: string }
        version:
          type: integer
          description: Incremented on every write. Surfaced as the ETag.
        event_type_id: { type: string, format: uuid }
        event_type_slug: { type: [string, "null"] }
        title: { type: [string, "null"] }
        status: { type: string }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        timezone: { type: string }
        host:
          type: [object, "null"]
          properties:
            user_id: { type: string, format: uuid }
            username: { type: [string, "null"] }
            email: { type: [string, "null"] }
        attendees:
          type: array
          items:
            type: object
            properties:
              email: { type: string, format: email }
              name: { type: string }
              timezone: { type: [string, "null"] }
        guests:
          type: array
          items:
            type: object
            properties:
              email: { type: string, format: email }
              name: { type: string }
        location:
          type: [object, "null"]
          properties:
            type: { type: [string, "null"] }
            url: { type: [string, "null"], description: "Conferencing link, when one was generated." }
            value: { type: [string, "null"] }
        metadata:
          type: [object, "null"]
          description: Your own key-value data, echoed back unchanged.
          additionalProperties: true
        responses:
          type: [object, "null"]
          description: |
            Answers to the invitee form. Populated on single-booking reads; null in list
            responses, so fetch the booking directly when you need them.
          additionalProperties: true
        calendar_sync_status:
          type: string
          enum: [synced, pending, failed, not_applicable]
        calendar_event_id: { type: [string, "null"] }
        rescheduled_from_uid:
          type: [string, "null"]
          description: The booking this one replaced, if it came from a reschedule.
        cancelled_at:
          type: [string, "null"]
          format: date-time
          description: Note the British spelling of this field name, which is fixed by the contract.
        cancellation_reason: { type: [string, "null"] }
        no_show_at: { type: [string, "null"], format: date-time }
        no_show_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        series_id:
          type: [string, "null"]
          format: uuid
          description: The recurring series this booking belongs to, or null.
        series_index:
          type: [integer, "null"]
          description: 0-based position of this booking in its series, or null.

    CreateBookingRequest:
      type: object
      required: [start, attendee]
      description: |
        Identify the event type by `event_type_id`, or by `username` plus `event_slug`.
        Supplying neither is rejected.
      properties:
        event_type_id: { type: string, format: uuid }
        username: { type: string, maxLength: 127 }
        event_slug: { type: string, maxLength: 127 }
        start: { type: string, format: date-time }
        timezone:
          type: string
          maxLength: 64
          description: IANA timezone the attendee sees times in.
        attendee:
          type: object
          required: [email]
          properties:
            email:
              type: string
              format: email
              maxLength: 254
              description: Must be ASCII and deliverable. Accented local parts are rejected.
            name: { type: string, maxLength: 255 }
            first_name: { type: string, maxLength: 127 }
            last_name: { type: string, maxLength: 127 }
            phone:
              type: string
              maxLength: 64
              description: International format, starting with `+`. Required when `sms_opt_in` is true.
            timezone: { type: string, maxLength: 64 }
            sms_opt_in:
              type: boolean
              description: |
                The attendee agrees to get text messages about this booking. It needs `phone`
                as a valid number in international format, starting with `+`. Without a phone
                the request is rejected with 400 `attendee_phone_required`, and with a number
                that is not valid with 400 `attendee_phone_invalid`. The booking then stores the
                phone in E.164 form. Workflow SMS steps text only attendees who agreed.
        guests:
          type: array
          description: Additional people to copy on the invitation.
          items: { type: string, format: email }
        metadata:
          type: object
          description: Arbitrary key-value data returned unchanged on reads.
          additionalProperties: true
        responses:
          type: object
          description: Answers to the event type's invitee questions, keyed by question key.
          additionalProperties: true
        utm_source: { type: string, maxLength: 255 }
        utm_medium: { type: string, maxLength: 255 }
        utm_campaign: { type: string, maxLength: 255 }
      examples:
        - event_type_id: "6f2a1c94-0d3b-4f7e-8a25-1c9d4b7e0f31"
          start: "2026-09-15T14:00:00.000Z"
          timezone: "Europe/Lisbon"
          attendee:
            email: "ada@example.com"
            name: "Ada Lovelace"
            timezone: "Europe/Lisbon"
          metadata:
            crm_deal_id: "D-4471"

    UpdateBookingRequest:
      type: object
      description: |
        Only these three fields are writable. Including `start`, `end`, `timezone`,
        `status`, `event_type_id`, `uid` or `version` returns 422 `field_immutable`,
        naming the offending fields in `details.fields`. To move a booking use
        `/reschedule`; to cancel it use `/cancel`.
      properties:
        metadata:
          type: object
          description: |
            Shallow-merged into existing metadata, not replaced. There is no way to
            remove a key through this endpoint.
          additionalProperties: true
        responses:
          type: object
          description: Replaces the stored invitee form answers outright.
          additionalProperties: true
        attendee_name:
          type: string
          description: Truncated to 200 characters.

    Series:
      type: object
      description: |
        A recurring meeting booked as one repeating pattern. The occurrences it
        produced are ordinary bookings: list them with
        `GET /v1/bookings?series_id={uid}`.
      required:
        [uid, version, event_type, host, attendee, frequency, interval_weeks, weekdays,
         time, timezone, starts_on, count, status, notify_invitee, source, created_at,
         updated_at]
      properties:
        uid: { type: string, format: uuid }
        version:
          type: integer
          description: The series revision. Incremented by every action. Surfaced as the ETag.
        event_type:
          type: object
          required: [id, slug, name]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
        host:
          type: object
          required: [user_id, email]
          properties:
            user_id: { type: string, format: uuid }
            username: { type: [string, "null"] }
            email: { type: string }
        attendee:
          type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string }
            phone: { type: [string, "null"] }
        frequency:
          type: string
          enum: [weekly, monthly_same_day]
        interval_weeks:
          type: integer
          description: Weeks between repeats. Ignored when `frequency` is `monthly_same_day`.
        weekdays:
          type: array
          description: Empty for a monthly series.
          items: { type: string, enum: [sun, mon, tue, wed, thu, fri, sat] }
        time:
          type: string
          description: Wall clock in `timezone`, `HH:MM` on a 24-hour clock.
        timezone: { type: string }
        starts_on:
          type: string
          format: date
          description: The first civil day the pattern is walked from.
        count:
          type: integer
          description: Occurrences requested. Fewer may exist when dates were skipped.
        status:
          type: string
          enum: [active, paused, ended]
        location_url:
          type: [string, "null"]
          description: The fixed link every occurrence carries, when the series was created with one.
        notify_invitee: { type: boolean }
        source:
          type: string
          description: Where the series came from.
          enum: [public, internal, api, mcp]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }

    SeriesWithProgress:
      description: |
        A series plus where it is in its run right now. This is what `GET /v1/series`
        and `GET /v1/series/{uid}` return, so a client can see the next meeting and
        how many are left without paging `/v1/bookings?series_id=` for every row.

        `POST /v1/series` and `PATCH /v1/series/{uid}` answer with the plain `Series`
        shape instead: both already report what they just did through their own
        fields.
      allOf:
        - $ref: "#/components/schemas/Series"
        - type: object
          required: [next_occurrence, remaining]
          properties:
            next_occurrence:
              description: |
                The soonest CONFIRMED occurrence still ahead, or null when none is
                left (a paused, ended or finished series). Its `uid` is a booking uid.
              anyOf:
                - type: object
                  required: [uid, start_at]
                  properties:
                    uid: { type: string, format: uuid }
                    start_at: { type: string, format: date-time }
                - type: "null"
            remaining:
              type: integer
              description: |
                How many confirmed occurrences are still ahead. Held occurrences (a
                paused series) are canceled rows, so they are NOT counted here; `owed`
                on a resume is what says how many are waiting to be rebooked.

    SeriesOccurrence:
      type: object
      description: One booked occurrence. Its `uid` is a booking uid, usable on every `/v1/bookings` route.
      required: [uid, start_at, end_at, status]
      properties:
        uid: { type: string, format: uuid }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        status: { type: string }

    SeriesSkip:
      type: object
      description: A date in the pattern that could not be booked. It does not shift; it is dropped.
      required: [start_at, reason]
      properties:
        start_at: { type: string, format: date-time }
        reason: { type: string, enum: [conflict] }

    SeriesActionResult:
      type: object
      description: |
        The outcome of one series action. Each action fills in only its own fields, so
        read the ones documented for the endpoint you called.
      properties:
        held:
          type: integer
          description: Pause. Occurrences canceled and recorded as owed.
        created:
          type: integer
          description: Resume. Replacement occurrences booked.
        skipped:
          type: array
          description: Resume. Dates the pattern generates but cannot use, whether or not anything was booked.
          items: { $ref: "#/components/schemas/SeriesSkip" }
        owed:
          type: integer
          description: Resume. Occurrences still waiting for a replacement. Non-zero means the series stays paused.
        canceled:
          type: integer
          description: End. Occurrences canceled for good.
        moved:
          type: integer
          description: Change host. Occurrences transferred.
        unchanged:
          type: integer
          description: Change host. Occurrences already hosted by the target, so nothing to transfer.
        stopped_by:
          type: [string, "null"]
          description: |
            Change host. Why the run stopped early, or null when it finished and the
            series host was changed. A closed set of codes, safe to branch on:

            - `series_busy`: another action took the series over mid-run. The same
              condition, and the same code, as the 409 this API throws for it.
            - `host_not_allowed`: the credential may not move meetings to that host.
            - `host_not_eligible`: the new host is not an active user of this
              organization.
            - `host_calendar_required`: the new host has no writable calendar of the
              provider this event type's meeting link needs.
            - `host_already_booked`: the new host already has another meeting at that
              occurrence's time. An ordinary scheduling conflict, not a fault of ours;
              pick a different host or time for it and repeat the call.
            - `occurrence_shared`: one occurrence shares its conference or calendar
              entry with another booking, so its host cannot be moved on its own.
            - `occurrence_canceled`: one occurrence was canceled while the run went.
            - `occurrence_not_found`: one occurrence could not be found; it may have
              been removed while the run was going.
            - `occurrence_changed`: one occurrence moved while the run went.
            - `occurrence_busy`: another operation on one occurrence is still
              finishing.
            - `host_change_unavailable`: the per-meeting transfer lock could not be
              taken. Transient; retry.
            - `internal_error`: an unexpected failure. Quote `meta.request_id`.

            Whatever the reason, `moved` occurrences ARE on the new host and the series
            host is unchanged, so the call can simply be repeated once the cause is
            fixed.
          enum:
            [null, series_busy, host_not_allowed, host_not_eligible, host_calendar_required,
             host_already_booked, occurrence_shared, occurrence_canceled, occurrence_not_found,
             occurrence_changed, occurrence_busy, host_change_unavailable, internal_error]
        superseded:
          type: boolean
          description: |
            Pause, Resume and End, plus the resume a pattern-changing PATCH embeds
            under `resumed`. Another action took the series over while this one was
            running, so it stopped where it was. The counts above are what it did
            finish; repeat the call to do the rest. Change Host never sets this; it
            reports the same situation through `stopped_by` instead.

            Under `resumed` it also covers the case where the resume never started:
            the PATCH wrote the new pattern and paused the series, and another action
            then took it over before a single replacement was booked. That is
            `created: 0` with `owed` naming what is still waiting. Read the series
            again and call `/resume` with the current `ETag`.

            The same field also covers a resume that DID start booking replacements
            before being taken over: `created` and `skipped` are what that partial
            walk actually did, real confirmed meetings and all, never zeroed out
            because the run did not finish. `owed` still names what is left, and
            `/resume` with the current `ETag` converges on the rest.

    CreateSeriesRequest:
      type: object
      required: [host_user_id, attendee, frequency, time, starts_on, count]
      properties:
        host_user_id:
          type: string
          format: uuid
          description: Whose calendar the series is booked on. Must be someone you may act for.
        event_type_id:
          type: string
          format: uuid
          description: Required unless `username` and `event_slug` are both given.
        username: { type: string }
        event_slug: { type: string }
        attendee:
          type: object
          required: [email]
          properties:
            email: { type: string, format: email }
            name: { type: string }
            first_name: { type: string }
            last_name: { type: string }
            phone: { type: string }
        frequency:
          type: string
          enum: [weekly, monthly_same_day]
        interval_weeks:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
          description: Weeks between repeats. Weekly patterns only.
        weekdays:
          type: array
          maxItems: 7
          description: Required for a weekly pattern.
          items: { type: string, enum: [sun, mon, tue, wed, thu, fri, sat] }
        time:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
          description: Wall clock in `timezone`, `HH:MM` on a 24-hour clock.
        timezone:
          type: string
          description: IANA zone. Defaults to the host user's own zone.
        starts_on:
          type: string
          format: date
          description: The first civil day the pattern is walked from. Past instants are never booked.
        count:
          type: integer
          minimum: 1
          maximum: 42
          description: Occurrences to book. Dates that are not free are skipped, not shifted.
        location_url:
          type: string
          description: A fixed http(s) link every occurrence carries instead of a generated conference.
        notify_invitee:
          type: boolean
          default: true
          description: When false the attendee gets no mail for this series.
      example:
        host_user_id: "8b7c1e6f-1111-4222-8333-444455556666"
        event_type_id: "1c2d3e4f-5555-4666-8777-888899990000"
        attendee:
          email: "ada@example.com"
          name: "Ada Lovelace"
        frequency: weekly
        interval_weeks: 1
        weekdays: [mon, wed]
        time: "18:30"
        timezone: "Europe/Lisbon"
        starts_on: "2026-09-14"
        count: 24

    UpdateSeriesRequest:
      type: object
      description: |
        Send only what changes. A pattern field (`frequency`, `interval_weeks`,
        `weekdays`, `time`) rebooks the future occurrences; `location_url` and
        `notify_invitee` restamp them in place. `starts_on`, `count`, the attendee and
        the event type are fixed for the life of a series.
      properties:
        frequency:
          type: string
          enum: [weekly, monthly_same_day]
        interval_weeks: { type: integer, minimum: 1, maximum: 8 }
        weekdays:
          type: array
          maxItems: 7
          items: { type: string, enum: [sun, mon, tue, wed, thu, fri, sat] }
        time: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        location_url:
          type: string
          description: |
            Replaces the series' existing fixed link. A series created without one
            cannot gain one here, and an existing link cannot be cleared this way
            either: sending `null` is refused as a validation error, not treated as
            "remove it".
        notify_invitee: { type: boolean }

    ChangeSeriesHostRequest:
      type: object
      required: [host_user_id]
      properties:
        host_user_id:
          type: string
          format: uuid
          description: The new host. Must be someone you may act for.

    WebhookEnvelope:
      type: object
      description: |
        Common shape of every outbound delivery. Note it is camelCase, unlike the
        snake_case REST API, and that `id` here is the EVENT id, distinct from the
        delivery id in the `X-42min-Webhook-Id` header (which is stable across retries
        and is what you dedupe on).
      required: [id, event, createdAt, apiVersion, data]
      properties:
        id:
          type: string
          description: Event id, prefixed `evt_`.
          examples: ["evt_9f1c3b7a-2d44-4a1e-9c07-1b2f5e8a3d61"]
        event: { $ref: "#/components/schemas/WebhookEventDotName" }
        createdAt: { type: string, format: date-time }
        apiVersion:
          type: string
          description: Payload contract version.
          examples: ["2026-04-01"]

    WebhookBooking:
      type: object
      description: |
        The booking as webhooks render it. This is NOT the same shape as the REST
        `Booking`: it is camelCase, nests differently, and carries fields the REST
        resource does not (answers, urlParams, meetLink).
      required:
        [id, eventTypeId, startTime, endTime, timezone, status, inviteeName,
         inviteeEmail, organizationId]
      properties:
        id: { type: string }
        eventTypeId: { type: string, format: uuid }
        eventTypeName: { type: [string, "null"] }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        timezone: { type: string }
        status: { type: string }
        inviteeName: { type: string }
        inviteeEmail: { type: string, format: email }
        inviteePhone: { type: [string, "null"] }
        guests:
          type: array
          items: { type: object, additionalProperties: true }
        answers:
          type: object
          description: Invitee form answers keyed by question label.
          additionalProperties: true
        answersById:
          type: object
          description: The same answers keyed by question id, stable across relabeling.
          additionalProperties: true
        routingFormAnswers:
          type: [object, "null"]
          additionalProperties: true
        urlParams:
          type: object
          description: |
            Tracking and custom parameters the booking link carried, merged into one
            map. Recognized tracking keys win over a custom key of the same name.
          additionalProperties: true
        location: { type: [string, "null"] }
        meetLink:
          type: [string, "null"]
          description: Conferencing URL, when one was generated.
        cancelledAt: { type: [string, "null"], format: date-time }
        cancelledReason: { type: [string, "null"] }
        noShowAt: { type: [string, "null"], format: date-time }
        noShowReason: { type: [string, "null"] }
        rescheduledAt: { type: [string, "null"], format: date-time }
        reschedule_generation:
          type: integer
          description: |
            Which move this payload describes, starting at 0. Use it to order or dedupe
            reschedules: matching on booking id alone lets the first reschedule satisfy
            every later one. Note the snake_case name among camelCase siblings; it is
            fixed by the contract.
        series_id:
          type: [string, "null"]
          format: uuid
          description: |
            The recurring series this booking belongs to, or null. Snake_case among
            camelCase siblings, like `reschedule_generation` above.
        series_index:
          type: [integer, "null"]
          description: 0-based position of this booking in its series, or null.
        hostUser:
          type: [object, "null"]
          properties:
            id: { type: [string, "null"] }
            firstName: { type: [string, "null"] }
            lastName: { type: [string, "null"] }
            email: { type: [string, "null"] }
        organizationId: { type: string, format: uuid }

    BookingWebhookEnvelope:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [booking]
              properties:
                booking: { $ref: "#/components/schemas/WebhookBooking" }
                previousBooking:
                  type: object
                  description: "Present only on `booking.rescheduled`. Where the meeting was before."
                  properties:
                    startTime: { type: string, format: date-time }
                    endTime: { type: string, format: date-time }
                    timezone: { type: string }
                changed_fields:
                  type: array
                  description: "Present only on `booking.updated`. Which fields the PATCH wrote."
                  items: { type: string }
      examples:
        - id: "evt_9f1c3b7a-2d44-4a1e-9c07-1b2f5e8a3d61"
          event: "booking.created"
          createdAt: "2026-09-09T12:00:00.000Z"
          apiVersion: "2026-04-01"
          data:
            booking:
              id: "bk_7c1e9a2f"
              eventTypeId: "6f2a1c94-0d3b-4f7e-8a25-1c9d4b7e0f31"
              eventTypeName: "Intro call"
              startTime: "2026-09-15T14:00:00.000Z"
              endTime: "2026-09-15T14:42:00.000Z"
              timezone: "Europe/Lisbon"
              status: "confirmed"
              inviteeName: "Ada Lovelace"
              inviteeEmail: "ada@example.com"
              reschedule_generation: 0
              organizationId: "0b7d2e51-8c4a-4f19-9a63-2d5e7c1b4f80"

    EventTypeWebhookEnvelope:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [event_type]
              properties:
                event_type:
                  allOf:
                    - $ref: "#/components/schemas/EventTypeDetail"
                  description: |
                    The same shape `GET /v1/event-types/{idOrSlug}` returns. On
                    `event_type.deleted` it describes the event type as it was.

    RoutingWebhookEnvelope:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [response]
              properties:
                response:
                  type: object
                  required: [id, routingFormId, organizationId]
                  properties:
                    id: { type: string, format: uuid }
                    routingFormId: { type: string, format: uuid }
                    formName: { type: [string, "null"] }
                    answers:
                      type: object
                      description: What the lead answered.
                      additionalProperties: true
                    destinationType:
                      type: string
                      description: Where the matched rule sent them.
                    destinationValue: { type: [string, "null"] }
                    organizationId: { type: string, format: uuid }

    WebhookEventName:
      type: string
      description: |
        Event names as the REST API accepts and returns them. Note these are
        **underscore** names. The dot-separated form (`booking.created`) appears
        only on the outbound delivery, in its payload and the
        `X-42min-Webhook-Event` header. Subscribing with a dot name is rejected
        with 400.
      enum:
        - booking_created
        - booking_updated
        - booking_canceled
        - booking_rescheduled
        - booking_no_show
        - event_type_updated
        - event_type_deleted
        - routing_form_submitted

    WebhookEventDotName:
      type: string
      description: |
        The same events as they appear on an outbound delivery. Use
        `WebhookEventName` when talking to the REST API.
      enum:
        - booking.created
        - booking.updated
        - booking.canceled
        - booking.rescheduled
        - booking.no_show
        - event_type.updated
        - event_type.deleted
        - routing.form_submitted

    Webhook:
      type: object
      required: [id, url, events, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        events:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventName" }
        status: { type: string }
        description: { type: [string, "null"] }
        paused_reason:
          type: [string, "null"]
          description: Why we stopped delivering, when a subscription was paused automatically.
        last_delivery_at: { type: [string, "null"], format: date-time }
        last_delivery_ok: { type: [boolean, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookWithSecret:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          properties:
            signing_secret:
              type: string
              description: |
                The signing secret, returned only on creation and rotation. It cannot be
                read back afterwards, and is absent from every other response.

    WebhookDelivery:
      type: object
      required: [id, event, attempt, created_at]
      properties:
        id: { type: string }
        event: { $ref: "#/components/schemas/WebhookEventName" }
        attempt: { type: integer, description: "1 on the first try, incremented on each retry." }
        status_code:
          type: [integer, "null"]
          description: HTTP status your endpoint returned, or null if it was unreachable.
        error: { type: [string, "null"] }
        delivered_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
